<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snippet Studio — Free Web Code Editor with Live Preview</title>
<meta name="description" content="Snippet Studio is a free desktop app for writing HTML, CSS, and JavaScript with an instant, interactive live preview. Download the installer or the portable build for Windows and start coding right away.">
<meta property="og:title" content="Snippet Studio — Free Web Code Editor with Live Preview">
<meta property="og:description" content="Write HTML, CSS, and JavaScript and see your changes update instantly in a live, interactive preview. Free for Windows — installer or portable.">
<meta property="og:image" content="https://raw.githubusercontent.com/RibomX/Snippet-Studio/main/favicon69.ico">
<meta property="og:type" content="website">
<link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/RibomX/Snippet-Studio/main/favicon69.ico">
<style>
  :root {
    --page-bg: #f1f1f1;
    --term-bg: #ffffff;
    --term-border: #8e8e8e;
    --titlebar-bg: #f4f4f4;
    --titlebar-text: #1a1a1a;
    --text: #1a1a1a;
    --text-dim: #6e6e6e;
    --prompt: #1a1a1a;
    --success: #0a7a2f;
    --key: #0a4fa0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: var(--page-bg);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  .page {
    width: 100%;
    max-width: 760px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  /* --- cmd.exe style window --- */
  .terminal {
    width: 100%;
    background: var(--term-bg);
    border: 1px solid var(--term-border);
    box-shadow: 1px 1px 0 rgba(0,0,0,0.15);
  }

  .terminal-titlebar {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 6px 5px 8px;
    background: var(--titlebar-bg);
    border-bottom: 1px solid var(--term-border);
    user-select: none;
  }
  .terminal-titlebar img {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
  }
  .terminal-titlebar .title {
    flex: 1;
    font-size: 12.5px;
    color: var(--titlebar-text);
  }
  .win-buttons {
    display: flex;
    gap: 1px;
  }
  .win-btn {
    width: 28px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 11px;
    color: var(--titlebar-text);
    background: transparent;
  }
  .win-btn svg {
    width: 9px;
    height: 9px;
  }

  .terminal-body {
    padding: 10px 12px 14px;
    font-family: Consolas, "Courier New", monospace;
    font-size: 14.5px;
    line-height: 1.55;
    min-height: 340px;
    color: var(--text);
  }

  .line {
    white-space: pre-wrap;
    word-break: break-word;
  }
  .line.system {
    color: var(--text-dim);
  }
  .line.success {
    color: var(--success);
  }
  /* The numbered choices: the key stands out, the description recedes.
     The hanging indent keeps a wrapped option tucked under itself on a
     narrow screen instead of running back to column zero. */
  .line.option {
    padding-left: 2.4em;
    text-indent: -2.4em;
  }
  .line.option .key {
    color: var(--key);
    font-weight: 600;
  }
  .line.option .note {
    color: var(--text-dim);
  }

  .input-line {
    display: flex;
    align-items: baseline;
  }
  .prompt-symbol {
    color: var(--prompt);
    flex-shrink: 0;
  }
  #terminalInput {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-family: Consolas, "Courier New", monospace;
    font-size: 14.5px;
    color: var(--text);
    caret-color: var(--text);
    padding: 0;
    margin-left: 6px;
    min-width: 40px;
  }
  #terminalInput::placeholder {
    color: transparent;
  }

  .blink-cursor {
    display: inline-block;
    width: 8px;
    height: 16px;
    background: var(--text);
    margin-left: 6px;
    animation: blink 1s steps(1) infinite;
    vertical-align: -3px;
  }
  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  .footnote {
    font-size: 12.5px;
    color: #777;
    font-family: "Segoe UI", -apple-system, Arial, sans-serif;
    text-align: center;
    max-width: 520px;
    line-height: 1.6;
  }
  .footnote a {
    color: #555;
  }

  /* Keep the option rows on one line each on small phones. */
  @media (max-width: 620px) {
    .terminal-body {
      font-size: 12px;
      padding: 9px 10px 12px;
    }
    #terminalInput { font-size: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .blink-cursor { animation: none; opacity: 1; }
  }
</style>
</head>
<body>

<div class="page">

  <div class="terminal">
    <div class="terminal-titlebar">
      <img src="https://raw.githubusercontent.com/RibomX/Snippet-Studio/main/favicon69.ico" alt="">
      <span class="title">C:\Program Files\Snippet Studio\downloader.exe</span>
      <div class="win-buttons">
        <span class="win-btn">&#x2013;</span>
        <span class="win-btn">&#x25A1;</span>
        <span class="win-btn">
          <svg viewBox="0 0 10 10"><line x1="0" y1="0" x2="10" y2="10" stroke="currentColor" stroke-width="1.2"/><line x1="10" y1="0" x2="0" y2="10" stroke="currentColor" stroke-width="1.2"/></svg>
        </span>
      </div>
    </div>
    <div class="terminal-body" id="terminalBody">
      <!-- Lines are inserted here by JS -->
    </div>
  </div>

<p class="footnote">
  Snippet Studio is a free desktop app for writing HTML, CSS, and JavaScript with a live,
  interactive preview. Windows 10 and 11, 64-bit.
</p>

</div>

<script>
  // ---------------------------------------------------------------
  // CONFIGURE THIS
  //
  // These links use GitHub's "latest release" redirect, so this page only
  // needs touching when the file NAMES change — create a new release, upload
  // the files, and mark it as the latest one.
  //
  // IMPORTANT: the file names below must match the asset names on the
  // release EXACTLY. GitHub turns spaces in uploaded file names into
  // dots, so "Snippet Studio 1.01.exe" is served as the name below.
  // If you ever rename the build output, update these three strings.
  // ---------------------------------------------------------------
  const RELEASE_BASE = "https://github.com/RibomX/Snippet-Studio/releases/latest/download/";

  const DOWNLOADS = [
    {
      key: "1",
      aliases: ["1", "installer", "setup", "exe"],
      label: "Installer",
      size: "75 MB",
      note: "recommended",
      file: "Snippet.Studio.1.01.exe"
    },
    {
      key: "2",
      aliases: ["2", "zip", "zipped"],
      label: "Installer (ZIP)",
      size: "75 MB",
      note: "for apps that block .exe files",
      file: "Snippet.Studio.1.01.zip"
    },
    {
      key: "3",
      aliases: ["3", "portable", "usb"],
      label: "Portable",
      size: "75 MB",
      note: "no install, runs from a USB stick",
      file: "Snippet.Studio.1.01.Portable.exe"
    }
  ];

  // ---------------------------------------------------------------

  const terminalBody = document.getElementById('terminalBody');
  let activeCursor = null;

  function removeActiveCursor() {
    if (activeCursor) {
      activeCursor.remove();
      activeCursor = null;
    }
  }

  function scrollToBottom() {
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }

  // Typewriter effect for a single line; resolves once the line is complete.
  function typeLine(text, cssClass, speed = 16) {
    return new Promise((resolve) => {
      removeActiveCursor();
      const line = document.createElement('div');
      line.className = 'line ' + (cssClass || '');
      terminalBody.appendChild(line);

      const cursor = document.createElement('span');
      cursor.className = 'blink-cursor';

      let i = 0;
      function step() {
        if (i <= text.length) {
          line.textContent = text.slice(0, i);
          if (i < text.length) {
            line.appendChild(cursor);
          }
          i++;
          scrollToBottom();
          setTimeout(step, speed);
        } else {
          cursor.remove();
          resolve();
        }
      }
      step();
    });
  }

  // Printed instantly. The menu would be tedious to watch being typed out.
  function printLine(html, cssClass) {
    removeActiveCursor();
    const line = document.createElement('div');
    line.className = 'line ' + (cssClass || '');
    line.innerHTML = html;
    terminalBody.appendChild(line);
    scrollToBottom();
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
  }

  function printMenu() {
    const labelWidth = Math.max.apply(null, DOWNLOADS.map((d) => d.label.length)) + 3;
    const sizeWidth = Math.max.apply(null, DOWNLOADS.map((d) => d.size.length)) + 3;
    printLine('');
    DOWNLOADS.forEach((item) => {
      printLine(
        '  <span class="key">[' + escapeHtml(item.key) + ']</span>  ' +
        escapeHtml(item.label.padEnd(labelWidth)) +
        escapeHtml(item.size.padEnd(sizeWidth)) +
        '<span class="note">' + escapeHtml(item.note) + '</span>',
        'option'
      );
    });
    printLine('');
  }

  function createInputLine() {
    const line = document.createElement('div');
    line.className = 'input-line';
    line.innerHTML =
      '<span class="prompt-symbol">&gt;</span>' +
      '<input type="text" id="terminalInput" autocomplete="off" autocapitalize="off" spellcheck="false">';
    terminalBody.appendChild(line);
    const input = line.querySelector('#terminalInput');
    input.focus();
    scrollToBottom();
    return input;
  }

  function freezeInputAsText(input, value) {
    const row = input.parentElement;
    row.innerHTML = '<span class="prompt-symbol">&gt;</span><span>&nbsp;' + escapeHtml(value) + '</span>';
  }

  function startDownload(item) {
    const a = document.createElement('a');
    a.href = RELEASE_BASE + item.file;
    a.download = '';
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function askQuestion() {
    const input = createInputLine();

    input.addEventListener('keydown', async (e) => {
      if (e.key !== 'Enter') return;

      const raw = input.value.trim().toLowerCase();
      if (!raw) return; // an empty Enter just waits, like a real prompt

      const choice = DOWNLOADS.find((d) => d.aliases.indexOf(raw) !== -1);
      freezeInputAsText(input, input.value.trim());

      if (!choice) {
        await typeLine("'" + input.value.trim() + "' is not one of the options.", 'system');
        await typeLine('Type 1, 2 or 3 and press Enter.', 'system');
        askQuestion();
        return;
      }

      await typeLine('Starting download: ' + choice.file, '');
      startDownload(choice);
      await typeLine('Thank you for downloading Snippet Studio! Enjoy!', 'success');
      await typeLine('', '');
      await typeLine('Need another build? Type 1, 2 or 3 again.', 'system');
      askQuestion();
    });
  }

  async function boot() {
    await typeLine('Welcome to the Snippet Studio download page!', '', 14);
    await typeLine('Version 1.01 is ready. Which build would you like?', '', 14);
    printMenu();
    await typeLine('Type 1, 2 or 3 and press Enter.', '', 14);
    askQuestion();
  }

  // Clicking anywhere in the window puts the caret back in the prompt,
  // unless the click was part of selecting text to copy.
  terminalBody.addEventListener('click', () => {
    if (window.getSelection && String(window.getSelection())) return;
    const input = document.getElementById('terminalInput');
    if (input) input.focus();
  });

  boot();
</script>

</body>
</html>
